version: '3'

info:
  companyName: Benjamin Raffetseder
  productName: Yap
  productIdentifier: com.yap.desktop
  description: Local dictation for your desktop
  version: 0.10.0
  copyright: ''
  comments: ''

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, node_modules, frontend, build, artifacts, third_party]
    file: [.DS_Store, .gitignore, .gitkeep, '*_test.go']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
