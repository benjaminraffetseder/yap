name: Build packages

# On-demand test packages only. No tags or releases are created or published.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            artifact: yap-windows-amd64-unsigned
            cgo: '0'
          - name: Linux x64
            runner: ubuntu-24.04
            artifact: yap-linux-amd64
            cgo: '1'
          - name: macOS universal
            runner: macos-15
            artifact: yap-macos-universal-adhoc
            cgo: '1'
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            third_party/hotkey/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
            libx11-dev libxext-dev dbus-daemon dpkg-dev desktop-file-utils

      - name: Install Wails CLI
        if: runner.os != 'macOS'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: wails3 build ARCH=amd64

      - name: Prepare unsigned Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-update.ps1

      - name: Build Debian package
        if: runner.os == 'Linux'
        run: |
          wails3 package ARCH=amd64
          (cd build/bin && sha256sum yap-*-linux-amd64.deb > SHA256SUMS)

      # This script installs the pinned Wails CLI, builds both architectures,
      # bundles Whisper/FFmpeg, tests the host slice, and produces checksums.
      - name: Build ad hoc signed macOS universal package
        if: runner.os == 'macOS'
        run: bash scripts/build-macos.sh universal

      - name: Test Go packages
        if: runner.os != 'macOS'
        run: go test ./...

      - name: Vet Go packages
        if: runner.os != 'macOS'
        run: go vet ./...

      - name: Upload package and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: |
            build/bin/yap-*-windows-amd64.exe
            build/bin/yap-*-linux-amd64.deb
            build/bin/Yap-*-macos-universal.zip
            build/bin/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
